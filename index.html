<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="practice.css">
    <title>Quick Quiz</title>
</head>
<body>
    <div class="container">
        <div class="screen active" id="start-screen">
            <h1> ! وقت الاختبار</h1>
            <p>! حان وقت اختبار معلوماتك </p>
            <button id="start-btn">البدء</button>
        </div>
        <div class="screen" id="quiz-screen">

            <div class="quiz-header">
                <h2 class="question-text" id="question-text">Question Goes here</h2>
                <div class="quiz-info">
                    <p>Question  <span id="current-question" >  1  </span>  of  <span id="total-questions">  5  </span></p>
                    <p>Score   <span id="score">  0</span></p>
                </div>
            </div>
        <div class="answers-container" id="answers-container">
            <!--here's where we gonna write the answers with JS-->
        </div>
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
        </div>
        <div class="screen" id="result-screen">
            <h1> ! نتائج الاختبار</h1>
            <div class="result-info">
                <p>You Scored <span id="final-score" > 0 </span> out of  <span id="max-score"> 5</span></p>
                <div id="result-message">good job</div>
            </div>
        <button id="restart-quiz-btn">Restart Quiz</button>    
        </div>
    </div>
    <script src="practice.js"></script>
</body>
</html>
